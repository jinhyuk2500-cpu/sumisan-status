<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>프릭씨앤에스 현황 (보기 전용)</title>
<style>
/* 현장 사무실 게시판 느낌: 차분한 청회색 바탕 + 안전주황 포인트. 잠금 화면 → 요약 → 탭 → 표 */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#1d2731; --muted:#5f6b77; --line:#d9dfe5;
  --accent:#d9661f; --accent-soft:#fbe9dc;
  --ok:#2f7d4f; --ok-soft:#e1f2e7; --warn:#a96a00; --warn-soft:#fff1d1; --bad:#b4342b; --bad-soft:#fbe3e1; --info:#2d5f8f; --info-soft:#e2edf7;
  --body:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a20; --panel:#1c242c; --ink:#e7ecf0; --muted:#9aa7b3; --line:#2f3a45;
  --accent:#f08a45; --accent-soft:#3a2a1f;
  --ok:#6fcf97; --ok-soft:#1e3528; --warn:#f2c14e; --warn-soft:#3a3120; --bad:#f2837a; --bad-soft:#3d2422; --info:#7fb2e5; --info-soft:#1f2f40;
  color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--accent);padding-bottom:12px}
h1{font-size:24px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.gate{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:12px}
.gate h1{font-size:20px}
.gate form{display:flex;gap:8px}
.gate input{flex:1}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
button{font:inherit;font-weight:700;border:0;background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:6px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;border-left:4px solid var(--line)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;font-weight:400}
button.stat:hover{border-color:var(--accent)}
button.stat[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.stat.bad{border-left-color:var(--bad)} .stat.ok{border-left-color:var(--ok)} .stat.warn{border-left-color:var(--warn)} .stat.acc{border-left-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
input:focus-visible,select:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#q{min-width:220px}
.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--bg);white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.main{cursor:pointer}
tr.main:hover td{background:var(--accent-soft)}
.site{font-weight:700}
.small{font-size:12px;color:var(--muted)}
.dd,.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dd{margin-left:4px}
.over{background:var(--bad-soft);color:var(--bad)} .soon{background:var(--warn-soft);color:var(--warn)} .later{background:var(--info-soft);color:var(--info)} .done{background:var(--ok-soft);color:var(--ok)}
.s-need{background:var(--warn-soft);color:var(--warn)} .s-progress{background:var(--info-soft);color:var(--info)} .s-done{background:#1e8e3e;color:#fff;font-weight:700} .s-hold{background:#d93025;color:#fff;font-weight:700} .s-quote{background:#7b2ff2;color:#fff;font-weight:700}
tr.detail td{background:var(--bg);font-size:13px}
.detail-grid{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;max-width:980px}
.detail-grid dt{color:var(--muted)} .detail-grid dd{margin:0;white-space:pre-line}
footer{color:var(--muted);font-size:12px}
/* 현장별 묶음 (조직도형) */
.org{display:flex;flex-direction:column;align-items:center;gap:0}
.org-root{background:var(--ink);color:var(--panel);font-weight:700;padding:10px 26px;border-radius:6px;text-align:center}
.org-root .small{color:inherit;opacity:.75}
.org-stem{width:2px;height:18px;background:var(--line)}
.org-grid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px 18px;border-top:2px solid var(--line);padding-top:18px}
.org-site{display:flex;flex-direction:column}
.org-head{background:var(--info);color:#fff;font-weight:700;padding:8px 12px;border-radius:6px;text-align:center}
.org-head span{font-weight:400;opacity:.85;margin-left:4px}
.org-branch{margin-left:14px;border-left:2px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:10px}
.org-cat{position:relative;margin-left:16px}
.org-cat::before{content:"";position:absolute;left:-18px;top:16px;width:16px;height:2px;background:var(--line)}
.org-cat-box{background:var(--info-soft);color:var(--info);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-weight:700;font-size:13px}
.org-items{list-style:none;margin:6px 0 0;padding:0 0 0 10px;display:flex;flex-direction:column;gap:4px}
.org-item{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:flex-start}
.org-item:hover{border-color:var(--accent);background:var(--accent-soft)}
.org-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.org-item .n{font-weight:700;font-variant-numeric:tabular-nums;min-width:20px;color:var(--muted)}
.org-item .t{flex:1}
.org-item .pill{font-size:11px;padding:0 6px}.stw{display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
@media (max-width:600px){.org-grid{grid-template-columns:1fr}}
.editor{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.sbtns{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;overflow:hidden}
.sbtns .sbtn{flex:0 0 auto;white-space:nowrap}
.shint{display:flex;gap:10px;margin-top:-4px}
.sbtn{font-size:15px;font-weight:700;padding:8px 15px;border-radius:18px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.sbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sbtn:disabled{opacity:.5;cursor:default}
.memo-row{display:flex;gap:8px;align-items:center}
.pfc{display:flex;flex-direction:column;gap:3px;min-width:130px}.pfiles{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pfw{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:5px;background:var(--bg)}.pfile{padding:1px 5px;font-size:13px;border:0;background:none;cursor:pointer}
.pfx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0 4px}
.pfup{font-size:12px;border:1px dashed var(--accent);color:var(--accent);border-radius:5px;padding:2px 7px;cursor:pointer;white-space:nowrap}.pfup.dis{opacity:.4;pointer-events:none}
.ctrbtns{display:flex;gap:6px;flex:0 0 auto}
.ctrb{border:1.5px solid var(--line);background:var(--panel);color:var(--muted);border-radius:18px;padding:7px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.ctrb.no[aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.ctrb.yes[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.ctrb:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.cmemo>span{color:var(--bad);font-weight:700;font-size:14px;min-width:62px}
.cmemo input{color:var(--bad);font-weight:700;font-size:16px;border-color:var(--bad)}
.cmemo input::placeholder{color:var(--bad);opacity:.45;font-weight:400}.memo-row{max-width:960px}.memo-row input{flex:1;min-width:0}.memo-row .mst{flex:0 0 64px;font-size:12px;color:var(--muted)}
#msg .note{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:13px}
#msg .note.err{background:var(--bad-soft);color:var(--bad)}
/* 금액 (매출·입금·지출) */
.fin{margin:4px 0 12px;display:flex;flex-direction:column;gap:10px}
.fin-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.fin-sum div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.fin-sum b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.fin-sum span{font-size:11.5px;color:var(--muted)}
.fin-sum .pf{border-color:var(--ok);background:var(--ok-soft)} .fin-sum .pf b{color:var(--ok)}
.fin-sum .ls{border-color:var(--bad);background:var(--bad-soft)} .fin-sum .ls b{color:var(--bad)}
.fin-sum .rq{border-color:var(--accent);background:var(--accent-soft)} .fin-sum .rq b{color:var(--accent)}
.fin-cols{display:grid;grid-template-columns:minmax(300px,2fr) minmax(420px,3fr);gap:12px}
@media (max-width:900px){.fin-cols{grid-template-columns:1fr}}
.fin-tbl{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.fin-tbl h4{margin:0;padding:6px 10px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.fin-tbl.in h4{background:var(--info-soft);color:var(--info)} .fin-tbl.out h4{background:var(--bad-soft);color:var(--bad)}
.fin-tbl table{min-width:0;font-size:12.5px}.fin-tbl.out table{min-width:720px}.fin-tbl select{min-width:66px}.fin-tbl input[type=date]{min-width:128px}
.fin-tbl th{font-size:11px;padding:4px 6px}.fin-tbl td{padding:3px 4px;border-bottom:1px dashed var(--line)}
.fin-tbl input,.fin-tbl select{padding:3px 5px;font-size:12.5px;width:100%}.fin-tbl select{min-width:66px}.fin-tbl input[type=date]{min-width:128px}.fin-tbl input{min-width:60px}
.fin-tbl input.amt{text-align:right;font-variant-numeric:tabular-nums}
.fin-tbl tfoot td{font-weight:700;border-bottom:0}
#pbar{margin-top:10px}
.rqlist{margin-top:8px;background:var(--panel);border:1px solid var(--accent);border-radius:8px;overflow-x:auto}
.rqlist .rqh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--accent-soft);color:var(--accent)}
.rqlist table{min-width:900px;font-size:13px}.rqlist th{font-size:11.5px;padding:5px 8px;text-align:left}.rqlist td{padding:6px 8px;border-top:1px solid var(--line)}.rqlist td.num{text-align:right;white-space:nowrap}
.rqlist tbody tr{cursor:pointer}.rqlist tbody tr:hover{background:var(--bg)}
.pbar{width:100%;display:flex;flex-wrap:wrap;align-items:stretch;gap:0;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;overflow:hidden}
.pbar .parea{flex:1 1 640px;display:flex;flex-wrap:wrap;align-items:stretch;background:none;border:0;padding:10px 14px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.pbar .parea:hover,.pbar .prq:hover:not(:disabled){background:var(--bg)}
.pbar .parea[aria-pressed=true],.pbar .prq[aria-pressed=true]{background:var(--ok-soft)}
.pbar .prq{flex:0 1 220px;background:none;border:0;border-left:1px solid var(--line);padding:10px 16px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.pbar .prq:disabled{cursor:default}.pbar .prq em{font-style:normal;font-size:11px;color:var(--muted)}
.pbar .prq.rq{background:var(--accent-soft)}.pbar .prq.rq em{color:var(--accent);font-weight:700}
.pbar.bad{border-left-color:var(--bad)}
.pbar .pmain{min-width:200px;padding-right:18px;margin-right:6px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.pbar .pmain span{font-size:12px;color:var(--muted)}.pbar .pmain b{font-size:24px;font-variant-numeric:tabular-nums}.pbar .pmain em{font-style:normal;font-size:11px;color:var(--muted)}
.pbar .pitem{flex:1 1 140px;padding:4px 14px;display:flex;flex-direction:column;justify-content:center;border-right:1px dashed var(--line)}
.pbar .pitem span{font-size:12px;color:var(--muted);white-space:nowrap}.pbar .pitem b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar .pitem.rq b{color:var(--accent)}

@media (max-width:700px){.pbar .pmain{border-right:0;width:100%;margin-bottom:6px}.pbar .parea .pitem{flex:1 1 45%;border-right:0;padding:4px 0}.pbar .prq{flex:1 1 100%;border-left:0;border-top:1px solid var(--line)}}
.plines{display:flex;flex-direction:column;gap:2px;margin:6px 0 4px;font-size:13px;width:100%}.plines div{display:flex;justify-content:space-between;gap:10px}.plines span{color:var(--muted);white-space:nowrap;font-size:12px}.plines b{font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.fin-tbl.req h4{background:var(--accent-soft);color:var(--accent)} .fin-tbl.req table{min-width:860px}
.rq-st{font-weight:700} .rq-st.s1{color:var(--warn)} .rq-st.s2{color:var(--info)} .rq-st.s3{color:var(--ok)} .rq-st.s4{color:var(--muted)}
.docbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;padding:3px 7px;font-size:12px;cursor:pointer;white-space:nowrap}
#rqdoc{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
#rqdoc .paper{background:#fff;color:#111;width:min(760px,100%);padding:36px 40px;border-radius:6px;font-family:var(--body)}

#rqdoc .step.on{color:#111;font-weight:700}#rqdoc .step.on i{background:#2f7d4f;border-color:#2f7d4f;color:#fff}
#rqdoc .step.now i{background:#d9661f;border-color:#d9661f;box-shadow:0 0 0 3px #fbe0cc}#rqdoc .step.now{color:#d9661f}

@media print{#rqdoc .ctr,#rqdoc .ctrwarn{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
#rqdoc .pmemo{margin-top:6px;font-size:12px;color:#333;display:flex;gap:14px;flex-wrap:wrap}
@media print{#rqdoc .step i,#rqdoc .step::after{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
#fview{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.fvbox{background:var(--panel);border-radius:8px;width:min(1000px,100%);height:min(90vh,1000px);display:flex;flex-direction:column;overflow:hidden}
.fvbar{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}.fvbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fvbar button,.fvdl{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.fvbody{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:#222;color:#ddd}.fvbody img{max-width:100%;max-height:100%;object-fit:contain}.fvbody iframe{width:100%;height:100%;border:0;background:#fff}
@media print{#fview{display:none!important}}
#rqdoc .datt{margin-top:12px}#rqdoc .agrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
#rqdoc .acell{width:150px;border:1px solid #999;border-radius:4px;padding:4px;background:#fff;font:inherit;text-align:left;cursor:pointer;color:#111;display:flex;flex-direction:column;gap:3px}
#rqdoc .acell img{width:100%;height:110px;object-fit:contain;background:#f6f6f6}#rqdoc .acell span{font-size:11px;word-break:break-all;line-height:1.3}
#rqdoc .apdf{height:110px;display:flex;align-items:center;justify-content:center;background:#f6f6f6;font-weight:700;color:#b4342b}
#rqdoc .dex{margin-top:10px;font-size:12.5px;line-height:1.5}
@media print{#rqdoc .seg,#rqdoc .legend i,#rqdoc .rqtop .due{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:12mm}}
@media (max-width:640px){#rqdoc .dcols{grid-template-columns:1fr}#rqdoc .rqtop{grid-template-columns:1fr}#rqdoc .dhead{flex-direction:column}}
#rqdoc .foot{margin-top:18px;text-align:right;font-size:14px}
@media print{body>*:not(#rqdoc){display:none!important}#rqdoc{position:static;background:none;padding:0}#rqdoc .bar{display:none}#rqdoc .paper{width:100%;padding:0}}
.xbtn{background:none;color:var(--muted);padding:2px 6px;font-weight:400}
.addbtn{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:2px 8px;font-size:12px}
.org-item{flex-wrap:wrap}.org-item .t{flex:1 1 60%}.org-item .pchip{margin-left:26px}.pchip{font-size:11px;font-weight:700;border-radius:10px;padding:0 6px;white-space:nowrap}
.stat .sent{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.stat .sent span{font-size:12px;font-weight:700;border-radius:10px;padding:1px 8px}
.stat .sent .s1{background:#7b2ff2;color:#fff}.stat .sent .s2{background:var(--warn-soft);color:var(--warn)}.stat .sent .s3{background:#1e8e3e;color:#fff}
[hidden]{display:none!important}
@media (max-width:600px){.filters{width:100%}.tabs{flex-wrap:wrap}h1{font-size:20px}.wrap{padding:16px 16px 40px}#q{min-width:0;flex:1}}
.gate{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:12px}
.gate h1{font-size:20px}.gate form{display:flex;gap:8px}.gate input{flex:1}.gate .err{color:var(--bad);font-size:13px;min-height:1.2em}
body.ro .addbtn,body.ro .xbtn,body.ro .pfup,body.ro .pfx,body.ro .mst{display:none!important}
body.ro input:disabled,body.ro select:disabled{opacity:1;color:inherit;background:transparent;-webkit-text-fill-color:currentColor;cursor:default}

body.ro .cmemo input:disabled{color:var(--bad)}
.rowarn{font-size:12px;color:var(--muted)}
body.ro input::placeholder{color:transparent}
[hidden]{display:none!important}

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>프릭씨앤에스 현황 · 보기 전용</h1>
      <div class="sub">현대엔지니어링 주택CS에서 받은 문서 · 번호는 받은 날짜 오래된 순 · 보기 전용 (입력·수정은 담당자 편집 페이지에서만) · 매일 밤 갱신</div>
    </div>
    <div class="small" id="updated"></div></header><div id="msg"></div><header hidden>
  </header>
  <section class="stats" id="stats" aria-label="요약"></section>
  <section id="pbar" aria-label="금액 요약"></section>
  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-org" aria-selected="true">현장별 묶음 <span id="cnt-g"></span></button>
      <button class="tab" role="tab" id="tab-work" aria-selected="false">작업지시서 <span id="cnt-w"></span></button>
      <button class="tab" role="tab" id="tab-survey" aria-selected="false">사전조사의뢰서 <span id="cnt-p"></span></button>
      <button class="tab" role="tab" id="tab-all" aria-selected="false">전체 목록 <span id="cnt-a"></span></button>
    </div>
    <div class="filters">
      <label class="small" for="q">검색</label>
      <input id="q" type="search" placeholder="현장, 공사명, 번호, 발신자">
      <label class="small" for="fs">상태</label>
      <select id="fs"><option value="">전체</option></select>
      <label class="small"><input type="checkbox" id="fo"> 기한 지난 미완료만</label>
    </div>
  </div>
  <div id="orgbox" class="org" hidden></div>
  <div class="tablebox" id="tablebox"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  <footer>건을 누르면 상세가 열리고, 거기서 진행상태 버튼과 메모로 바꿀 수 있어요. 바꾼 내용은 바로 저장되고, 매일 밤 메일 확인 때 엑셀·공유 사이트에 반영돼요.</footer>
</div>

<script>
const STATUSES=["확인 필요","접수","사전조사 완료","견적 회신 대기","견적 제출","날인본 회신","작업 진행","작업 완료","정산 완료","보류"];
const DONE_W=new Set(["작업 완료","정산 완료"]);
const DONE_P=new Set(["견적 제출","날인본 회신","작업 진행","작업 완료","정산 완료"]);
const state={db:null,canWrite:true,saving:new Set(),items:[],tab:"work",q:"",fs:"",fo:false,open:new Set()};
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

const ALIAS=[[/북위례|센트럴위례/,"힐스테이트 센트럴위례 (북위례)"],[/공평/,"공평오피스 (서울 공평 15·16지구)"],[/구리갈매|테라타워/,"현대테라타워 구리갈매"],[/분당 ?구미동|분당 ?엠코|엠코 ?헤리츠/,"분당 구미동 엠코 헤리츠"],[/상봉/,"상봉 프레미어스 엠코"],[/노원/,"노원 프레미어스 엠코"]];
function groupOf(site){const t0=(site||"").trim();for(const [re,n] of ALIAS)if(re.test(t0))return n;
  let t=t0.replace(/\s*\(.*?\)\s*/g," ").trim().replace(/^HS\s*/,"힐스테이트 ").replace(/\s+/g," ").trim();return t||"현장 미상"}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dday(due){const t=new Date(today()+"T00:00:00"),d=new Date(due+"T00:00:00");return Math.round((d-t)/86400000)}
function short(d){return d?d.slice(5).replace("-","/"):"–"}
function sts(i){const a=Array.isArray(i.statuses)&&i.statuses.length?i.statuses:String(i.status||"").split(/\s*[,·]\s*/).filter(Boolean);return a.length?a:["확인 필요"]}
function hasSt(i,s){return sts(i).includes(s)}
function pills(i){const f=document.createDocumentFragment();sts(i).forEach(s=>{const p=el("span","pill "+sclass(s),s);p.style.margin="0 3px 3px 0";p.style.display="inline-block";f.append(p)});return f}
const SENT=new Set(["견적 제출","날인본 회신","작업 진행","작업 완료","정산 완료"]);
const WORK_DONE=new Set(["작업 완료","정산 완료"]);
function isWorkDone(i){return sts(i).some(x=>WORK_DONE.has(x))}
function boxColor(i){if(isWorkDone(i))return "#1e8e3e";if(hasSt(i,"보류"))return "#d93025";if(hasSt(i,"견적 제출"))return "#7b2ff2";return ""}
function isWait(i){return hasSt(i,"견적 회신 대기")||hasSt(i,"보류")}
function isOver(i){return !isDone(i)&&!hasSt(i,"보류")&&i.due&&dday(i.due)<0}
function isSent(i){return sts(i).some(x=>SENT.has(x))}
function isDone(i){return sts(i).some(s=>DONE_P.has(s))}
function sclass(s){if(s==="견적 제출")return "s-quote";if(s==="확인 필요")return "s-need";if(s==="보류")return "s-hold";if(DONE_W.has(s))return "s-done";return "s-progress"}

function start(){
  STATUSES.forEach(s=>{const o=el("option",null,s);o.value=s;$("fs").append(o)});{const o=el("option",null,"견적 회신 대기 + 보류");o.value="__wait";$("fs").append(o)}
  $("tab-org").onclick=()=>setTab("org");$("tab-work").onclick=()=>setTab("work");$("tab-survey").onclick=()=>setTab("survey");$("tab-all").onclick=()=>setTab("all");
  $("q").oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};
  $("fs").onchange=e=>{state.fs=e.target.value;render()};
  $("fo").onchange=e=>{state.fo=e.target.checked;render()};
  const h=location.hash.slice(1);setTab(["work","survey","org","all"].includes(h)?h:"org");
}
function setTab(t){state.tab=t;$("tab-org").setAttribute("aria-selected",t==="org");$("tab-work").setAttribute("aria-selected",t==="work");$("tab-survey").setAttribute("aria-selected",t==="survey");$("tab-all").setAttribute("aria-selected",t==="all");try{history.replaceState(null,"","#"+t)}catch(e){}render()}

const HEAD={work:["No","받은 날짜","현장","공사명","작업지시번호","작업시작","완료요청","금액(원)","보낸 사람","이익금","진행상태","메모"],
            survey:["No","받은 날짜","현장","조사 대상","문서번호","조사기한","제출기한","보낸 사람","이익금","진행상태","메모"],
            all:["구분","No","받은 날짜","현장","내용","기한","보낸 사람","이익금","진행상태","메모"]};
function profitCell(i){const td=el("td","num");if(!hasFin(i)){td.append(el("span","small","–"));return td}
  const c=finCalc(finOf(i));const b=el("b",null,won(c.P));b.style.color=c.P>0?"var(--ok)":c.P<0?"var(--bad)":"var(--muted)";td.append(b);
  td.append(el("div","small","입금 "+won(c.D)+" · 지출 "+won(c.E)+(c.S>c.D?" · 미수 "+won(c.S-c.D):"")));return td}
function quick(k){state.fin=false;
  const cur=activeCard();
  if(cur===k&&k!=="w"&&k!=="p"){state.fs="";state.fo=false;syncFilters();setTab("all");return}
  state.fs="";state.fo=false;
  if(k==="need")state.fs="확인 필요";if(k==="wait")state.fs="__wait";if(k==="over")state.fo=true;
  syncFilters();setTab(k==="w"?"work":k==="p"?"survey":"all");
  requestAnimationFrame(()=>$("tablebox").scrollIntoView({block:"start",behavior:"smooth"}));
}
function syncFilters(){$("fs").value=state.fs;$("fo").checked=state.fo}
function activeCard(){
  if(state.fo&&!state.fs&&state.tab==="all")return "over";
  if(state.fs==="확인 필요"&&!state.fo&&state.tab==="all")return "need";
  if(state.fs==="__wait"&&!state.fo&&state.tab==="all")return "wait";
  if(!state.fs&&!state.fo&&state.tab==="work")return "w";
  if(!state.fs&&!state.fo&&state.tab==="survey")return "p";
  return "";
}
function nol(i){return String(i.no)+(i.sub?"-"+i.sub:"")}
function pass(i){
  if(state.fin==="rq"){if(!rqPend(finOf(i)).n)return false}else if(state.fin&&!hasFin(i))return false;
  if(state.fs&&!(state.fs==="__wait"?isWait(i):hasSt(i,state.fs)))return false;
  if(state.fo&&!isOver(i))return false;
